services:
  telegram-bot:
    container_name: telegram-bot
    build: .
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ALLOWED_USER_ID: ${ALLOWED_USER_ID}
      TAX_CODE: ${TAX_CODE}
      HEALTH_CARD: ${HEALTH_CARD}
    volumes:
      - telegram-bot-data:/app/data
    restart: unless-stopped

volumes:
  telegram-bot-data:
    name: "telegram-bot-data"
